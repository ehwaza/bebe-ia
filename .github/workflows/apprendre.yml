# .github/workflows/apprendre.yml — le fragment GitHub apprend en continu.
#
# Design (Claude + LYNX, 04/10) :
#   - le BUDGET TEMPS est le reglage (300 min), les interactions sont un
#     PLAFOND (5M) : on utilise pleinement le budget quel que soit le debit.
#   - le debit reel (ms/iter) est mesure et ecrit dans etats/etat_courant :
#     le run suivant se cale dessus tout seul.
#   - l'etat est COMMIT (etats/etat_courant) : le depot EST la memoire du
#     fragment GitHub. Le format interne reste bebe-etat/1 (C1-C5).
name: apprendre
on:
  schedule:
    - cron: "0 */6 * * *"    # toutes les 6 h
  workflow_dispatch:          # lancement manuel
permissions:
  contents: write
jobs:
  apprendre:
    runs-on: ubuntu-latest
    timeout-minutes: 340      # < cap GitHub 6 h, marge pour le commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: dependances
        run: pip install -r requirements.txt
      - name: apprentissage (budget temps 300 min)
        run: python scripts/entrainer_github.py --budget-seconds 18000 --plafond 5000000
      - name: sauvegarde de l'etat
        run: |
          git config user.name "bebe-github"
          git config user.email "bebe-github@users.noreply.github.com"
          git add etats resultats
          if git diff --cached --quiet; then
            echo "etat inchange : pas de commit"
          else
            git commit -m "cycle auto : $(date -u +%Y-%m-%dT%H:%M) UTC"
            git push
          fi
